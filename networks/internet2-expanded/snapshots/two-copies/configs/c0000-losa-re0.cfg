 maximum-paths 16
 network 10.0.0.6 mask 255.255.255.255
 neighbor 198.18.0.26 remote-as 4200000003
 neighbor 198.18.0.26 route-map SERVICES in
 neighbor 198.18.0.26 route-map SERVICES out
 neighbor 198.18.0.31 remote-as 4200000007
 neighbor 198.18.0.31 route-map SERVICES in
 neighbor 198.18.0.31 route-map SERVICES out
 neighbor 198.18.0.33 remote-as 4200000008
