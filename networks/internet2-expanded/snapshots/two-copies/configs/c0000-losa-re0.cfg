 neighbor 198.18.0.33 route-map SERVICES out
 neighbor 198.18.0.35 remote-as 4200000009
 neighbor 198.18.0.35 route-map SERVICES in
 neighbor 198.18.0.35 route-map SERVICES out
!
ip prefix-list SERVICES seq 10 permit 10.0.0.0/8 ge 32 le 32
route-map SERVICES permit 10
 match ip address prefix-list SERVICES
!
