version 15.2
hostname c0000-hous-re0
ip routing
!
interface Loopback0
 ip address 172.16.0.4 255.255.255.255
!
interface Loopback100
 ip address 10.0.0.4 255.255.255.255
!
interface GigabitEthernet0/0
 description to c0000-atla-re0
 no switchport
 ip address 198.18.0.5 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to c0000-kans-re0
 no switchport
 ip address 198.18.0.24 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description to c0000-losa-re0
 no switchport
 ip address 198.18.0.26 255.255.255.254
 no shutdown
!
router bgp 4200000003
 bgp router-id 172.16.0.4
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 network 10.0.0.4 mask 255.255.255.255
 neighbor 198.18.0.4 remote-as 4200000000
 neighbor 198.18.0.4 route-map SERVICES in
 neighbor 198.18.0.4 route-map SERVICES out
 neighbor 198.18.0.25 remote-as 4200000004
 neighbor 198.18.0.25 route-map SERVICES in
 neighbor 198.18.0.25 route-map SERVICES out
 neighbor 198.18.0.27 remote-as 4200000005
 neighbor 198.18.0.27 route-map SERVICES in
 neighbor 198.18.0.27 route-map SERVICES out
!
ip prefix-list SERVICES seq 10 permit 10.0.0.0/8 ge 32 le 32
route-map SERVICES permit 10
 match ip address prefix-list SERVICES
!
end
