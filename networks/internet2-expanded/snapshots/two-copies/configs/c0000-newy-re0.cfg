version 15.2
hostname c0000-newy-re0
ip routing
!
interface Loopback0
 ip address 172.16.0.7 255.255.255.255
!
interface Loopback100
 ip address 10.0.0.7 255.255.255.255
!
interface GigabitEthernet0/0
 description to c0000-atla-re0
 no switchport
 ip address 198.18.0.7 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to c0000-chic-re0
 no switchport
 ip address 198.18.0.17 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description to c0000-clev-re0
 no switchport
 ip address 198.18.0.21 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description to c0000-wash-re0
 no switchport
 ip address 198.18.0.36 255.255.255.254
 no shutdown
!
router bgp 4200000006
 bgp router-id 172.16.0.7
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 network 10.0.0.7 mask 255.255.255.255
 neighbor 198.18.0.6 remote-as 4200000000
 neighbor 198.18.0.6 route-map SERVICES in
 neighbor 198.18.0.6 route-map SERVICES out
 neighbor 198.18.0.16 remote-as 4200000001
 neighbor 198.18.0.16 route-map SERVICES in
 neighbor 198.18.0.16 route-map SERVICES out
 neighbor 198.18.0.20 remote-as 4200000002
 neighbor 198.18.0.20 route-map SERVICES in
 neighbor 198.18.0.20 route-map SERVICES out
 neighbor 198.18.0.37 remote-as 4200000009
 neighbor 198.18.0.37 route-map SERVICES in
 neighbor 198.18.0.37 route-map SERVICES out
!
ip prefix-list SERVICES seq 10 permit 10.0.0.0/8 ge 32 le 32
route-map SERVICES permit 10
 match ip address prefix-list SERVICES
!
end
