 maximum-paths 16
 network 10.0.0.14 mask 255.255.255.255
 neighbor 198.18.0.44 remote-as 4200000010
 neighbor 198.18.0.44 route-map SERVICES in
 neighbor 198.18.0.44 route-map SERVICES out
 neighbor 198.18.0.63 remote-as 4200000014
 neighbor 198.18.0.63 route-map SERVICES in
 neighbor 198.18.0.63 route-map SERVICES out
