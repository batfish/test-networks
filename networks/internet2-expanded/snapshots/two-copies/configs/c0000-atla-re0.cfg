version 15.2
hostname c0000-atla-re0
ip routing
!
interface Loopback0
 ip address 172.16.0.1 255.255.255.255
!
interface Loopback100
 ip address 10.0.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description to c0000-chic-re0
 no switchport
 ip address 198.18.0.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to c0000-clev-re0
 no switchport
 ip address 198.18.0.2 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description to c0000-hous-re0
 no switchport
 ip address 198.18.0.4 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description to c0000-newy-re0
 no switchport
 ip address 198.18.0.6 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description to c0000-wash-re0
 no switchport
 ip address 198.18.0.8 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description to c0001-newy-re0
 no switchport
 ip address 198.18.0.10 255.255.255.254
 no shutdown
!
router bgp 4200000000
 bgp router-id 172.16.0.1
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 network 10.0.0.1 mask 255.255.255.255
 neighbor 198.18.0.1 remote-as 4200000001
 neighbor 198.18.0.1 route-map SERVICES in
 neighbor 198.18.0.1 route-map SERVICES out
 neighbor 198.18.0.3 remote-as 4200000002
 neighbor 198.18.0.3 route-map SERVICES in
 neighbor 198.18.0.3 route-map SERVICES out
 neighbor 198.18.0.5 remote-as 4200000003
 neighbor 198.18.0.5 route-map SERVICES in
 neighbor 198.18.0.5 route-map SERVICES out
 neighbor 198.18.0.7 remote-as 4200000006
 neighbor 198.18.0.7 route-map SERVICES in
 neighbor 198.18.0.7 route-map SERVICES out
 neighbor 198.18.0.9 remote-as 4200000009
 neighbor 198.18.0.9 route-map SERVICES in
 neighbor 198.18.0.9 route-map SERVICES out
 neighbor 198.18.0.11 remote-as 4200000016
 neighbor 198.18.0.11 route-map SERVICES in
 neighbor 198.18.0.11 route-map SERVICES out
!
ip prefix-list SERVICES seq 10 permit 10.0.0.0/8 ge 32 le 32
route-map SERVICES permit 10
 match ip address prefix-list SERVICES
!
end
