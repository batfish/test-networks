version 15.2
hostname c0000-wash-re0
ip routing
!
interface Loopback0
 ip address 172.16.0.10 255.255.255.255
!
interface Loopback100
 ip address 10.0.0.10 255.255.255.255
!
interface GigabitEthernet0/0
 description to c0000-atla-re0
 no switchport
 ip address 198.18.0.9 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description to c0000-chic-re0
 no switchport
 ip address 198.18.0.19 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description to c0000-clev-re0
 no switchport
 ip address 198.18.0.23 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description to c0000-losa-re0
 no switchport
 ip address 198.18.0.35 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description to c0000-newy-re0
 no switchport
 ip address 198.18.0.37 255.255.255.254
 no shutdown
!
router bgp 4200000009
 bgp router-id 172.16.0.10
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 network 10.0.0.10 mask 255.255.255.255
 neighbor 198.18.0.8 remote-as 4200000000
 neighbor 198.18.0.8 route-map SERVICES in
 neighbor 198.18.0.8 route-map SERVICES out
 neighbor 198.18.0.18 remote-as 4200000001
 neighbor 198.18.0.18 route-map SERVICES in
 neighbor 198.18.0.18 route-map SERVICES out
 neighbor 198.18.0.22 remote-as 4200000002
 neighbor 198.18.0.22 route-map SERVICES in
 neighbor 198.18.0.22 route-map SERVICES out
 neighbor 198.18.0.34 remote-as 4200000005
 neighbor 198.18.0.34 route-map SERVICES in
 neighbor 198.18.0.34 route-map SERVICES out
 neighbor 198.18.0.36 remote-as 4200000006
 neighbor 198.18.0.36 route-map SERVICES in
 neighbor 198.18.0.36 route-map SERVICES out
!
ip prefix-list SERVICES seq 10 permit 10.0.0.0/8 ge 32 le 32
route-map SERVICES permit 10
 match ip address prefix-list SERVICES
!
end
