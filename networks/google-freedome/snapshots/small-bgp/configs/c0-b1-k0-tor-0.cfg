version 15.2
hostname c0-b1-k0-tor-0
ip routing
!
interface Loopback0
 ip address 172.16.0.107 255.255.255.255
!
interface Loopback100
 ip address 10.1.0.1 255.255.255.0
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b1-k0-agg-0
 no switchport
 ip address 198.18.3.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b1-k0-agg-1
 no switchport
 ip address 198.18.3.2 255.255.255.254
 no shutdown
!
router bgp 4240000106
 bgp router-id 172.16.0.107
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 network 10.1.0.0 mask 255.255.255.0
 neighbor 198.18.3.1 remote-as 4240000110
 neighbor 198.18.3.1 send-community both
 neighbor 198.18.3.1 route-map FABRIC_ROUTES in
 neighbor 198.18.3.1 route-map RACK_ONLY out
 neighbor 198.18.3.3 remote-as 4240000111
 neighbor 198.18.3.3 send-community both
 neighbor 198.18.3.3 route-map FABRIC_ROUTES in
 neighbor 198.18.3.3 route-map RACK_ONLY out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.1.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
ip prefix-list OWN_RACKS seq 10 permit 10.1.0.0/24
route-map RACK_ONLY permit 10
 match ip address prefix-list OWN_RACKS
!
end
