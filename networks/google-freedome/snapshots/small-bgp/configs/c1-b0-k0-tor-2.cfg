version 15.2
hostname c1-b0-k0-tor-2
ip routing
!
interface Loopback0
 ip address 172.16.0.119 255.255.255.255
!
interface Loopback100
 ip address 10.2.2.1 255.255.255.0
!
interface GigabitEthernet0/0
 description cluster-internal to c1-b0-k0-agg-0
 no switchport
 ip address 198.18.3.72 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c1-b0-k0-agg-1
 no switchport
 ip address 198.18.3.74 255.255.255.254
 no shutdown
!
router bgp 4240000118
 bgp router-id 172.16.0.119
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 network 10.2.2.0 mask 255.255.255.0
 neighbor 198.18.3.73 remote-as 4240000120
 neighbor 198.18.3.73 send-community both
 neighbor 198.18.3.73 route-map FABRIC_ROUTES in
 neighbor 198.18.3.73 route-map RACK_ONLY out
 neighbor 198.18.3.75 remote-as 4240000121
 neighbor 198.18.3.75 send-community both
 neighbor 198.18.3.75 route-map FABRIC_ROUTES in
 neighbor 198.18.3.75 route-map RACK_ONLY out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.2.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
ip prefix-list OWN_RACKS seq 10 permit 10.2.2.0/24
route-map RACK_ONLY permit 10
 match ip address prefix-list OWN_RACKS
!
end
