version 15.2
hostname c0-b0-k0-spine-0
ip routing
!
interface Loopback0
 ip address 172.16.0.103 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b0-k0-agg-0
 no switchport
 ip address 198.18.2.209 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b0-k0-agg-1
 no switchport
 ip address 198.18.2.213 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c0-b0-k0-cbr-0
 no switchport
 ip address 198.18.2.216 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c0-b0-k0-cbr-1
 no switchport
 ip address 198.18.2.218 255.255.255.254
 no shutdown
!
router bgp 4240000102
 bgp router-id 172.16.0.103
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.2.208 remote-as 4240000100
 neighbor 198.18.2.208 send-community both
 neighbor 198.18.2.208 route-map FABRIC_ROUTES in
 neighbor 198.18.2.208 route-map FABRIC_ROUTES out
 neighbor 198.18.2.212 remote-as 4240000101
 neighbor 198.18.2.212 send-community both
 neighbor 198.18.2.212 route-map FABRIC_ROUTES in
 neighbor 198.18.2.212 route-map FABRIC_ROUTES out
 neighbor 198.18.2.217 remote-as 4240000104
 neighbor 198.18.2.217 send-community both
 neighbor 198.18.2.217 route-map FABRIC_ROUTES in
 neighbor 198.18.2.217 route-map FABRIC_ROUTES out
 neighbor 198.18.2.219 remote-as 4240000105
 neighbor 198.18.2.219 send-community both
 neighbor 198.18.2.219 route-map FABRIC_ROUTES in
 neighbor 198.18.2.219 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.0.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
