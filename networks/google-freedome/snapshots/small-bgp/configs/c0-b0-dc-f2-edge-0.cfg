version 15.2
hostname c0-b0-dc-f2-edge-0
ip routing
!
interface Loopback0
 ip address 172.16.0.25 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c0-b0-dc-f2-border-0
 no switchport
 ip address 198.18.0.48 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c0-b0-dc-f2-border-1
 no switchport
 ip address 198.18.0.50 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c0-b0-k0-cbr-0
 no switchport
 ip address 198.18.2.233 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c0-b0-k0-cbr-1
 no switchport
 ip address 198.18.2.249 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.25
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4210000002
 bgp router-id 172.16.0.25
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.27 remote-as 4210000002
 neighbor 172.16.0.27 update-source Loopback0
 neighbor 172.16.0.27 next-hop-self
 neighbor 172.16.0.27 send-community both
 neighbor 172.16.0.27 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.27 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.28 remote-as 4210000002
 neighbor 172.16.0.28 update-source Loopback0
 neighbor 172.16.0.28 next-hop-self
 neighbor 172.16.0.28 send-community both
 neighbor 172.16.0.28 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.28 route-map PUBLIC_ROUTES out
 neighbor 198.18.2.232 remote-as 4240000104
 neighbor 198.18.2.232 send-community both
 neighbor 198.18.2.232 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.232 route-map PUBLIC_ROUTES out
 neighbor 198.18.2.248 remote-as 4240000105
 neighbor 198.18.2.248 send-community both
 neighbor 198.18.2.248 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.248 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
