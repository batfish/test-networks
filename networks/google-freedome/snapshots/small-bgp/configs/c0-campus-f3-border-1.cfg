version 15.2
hostname c0-campus-f3-border-1
ip routing
!
interface Loopback0
 ip address 172.16.0.16 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c0-campus-f3-edge-0
 no switchport
 ip address 198.18.0.27 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c0-campus-f3-edge-1
 no switchport
 ip address 198.18.0.31 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description wan-uplink to wan-0
 no switchport
 ip address 198.18.3.222 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description wan-uplink to wan-1
 no switchport
 ip address 198.18.3.224 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.16
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4220000003
 bgp router-id 172.16.0.16
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.15 remote-as 4220000003
 neighbor 172.16.0.15 update-source Loopback0
 neighbor 172.16.0.15 next-hop-self
 neighbor 172.16.0.15 send-community both
 neighbor 172.16.0.15 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.15 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.13 remote-as 4220000003
 neighbor 172.16.0.13 update-source Loopback0
 neighbor 172.16.0.13 next-hop-self
 neighbor 172.16.0.13 route-reflector-client
 neighbor 172.16.0.13 send-community both
 neighbor 172.16.0.13 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.13 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.14 remote-as 4220000003
 neighbor 172.16.0.14 update-source Loopback0
 neighbor 172.16.0.14 next-hop-self
 neighbor 172.16.0.14 route-reflector-client
 neighbor 172.16.0.14 send-community both
 neighbor 172.16.0.14 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.14 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.223 remote-as 4230000000
 neighbor 198.18.3.223 send-community both
 neighbor 198.18.3.223 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.223 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.225 remote-as 4230000000
 neighbor 198.18.3.225 send-community both
 neighbor 198.18.3.225 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.225 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
