version 15.2
hostname c0-b0-k0-spine-1
ip routing
!
interface Loopback0
 ip address 172.16.0.104 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b0-k0-agg-0
 no switchport
 ip address 198.18.2.211 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b0-k0-agg-1
 no switchport
 ip address 198.18.2.215 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c0-b0-k0-cbr-0
 no switchport
 ip address 198.18.2.220 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c0-b0-k0-cbr-1
 no switchport
 ip address 198.18.2.222 255.255.255.254
 no shutdown
!
router bgp 4240000103
 bgp router-id 172.16.0.104
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.2.210 remote-as 4240000100
 neighbor 198.18.2.210 send-community both
 neighbor 198.18.2.210 route-map FABRIC_ROUTES in
 neighbor 198.18.2.210 route-map FABRIC_ROUTES out
 neighbor 198.18.2.214 remote-as 4240000101
 neighbor 198.18.2.214 send-community both
 neighbor 198.18.2.214 route-map FABRIC_ROUTES in
 neighbor 198.18.2.214 route-map FABRIC_ROUTES out
 neighbor 198.18.2.221 remote-as 4240000104
 neighbor 198.18.2.221 send-community both
 neighbor 198.18.2.221 route-map FABRIC_ROUTES in
 neighbor 198.18.2.221 route-map FABRIC_ROUTES out
 neighbor 198.18.2.223 remote-as 4240000105
 neighbor 198.18.2.223 send-community both
 neighbor 198.18.2.223 route-map FABRIC_ROUTES in
 neighbor 198.18.2.223 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.0.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
