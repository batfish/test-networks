version 15.2
hostname c1-campus-f3-border-0
ip routing
!
interface Loopback0
 ip address 172.16.0.63 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c1-campus-f3-edge-0
 no switchport
 ip address 198.18.1.121 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c1-campus-f3-edge-1
 no switchport
 ip address 198.18.1.125 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description wan-uplink to wan-0
 no switchport
 ip address 198.18.3.250 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description wan-uplink to wan-1
 no switchport
 ip address 198.18.3.252 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.63
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4220000007
 bgp router-id 172.16.0.63
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.64 remote-as 4220000007
 neighbor 172.16.0.64 update-source Loopback0
 neighbor 172.16.0.64 next-hop-self
 neighbor 172.16.0.64 send-community both
 neighbor 172.16.0.64 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.64 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.61 remote-as 4220000007
 neighbor 172.16.0.61 update-source Loopback0
 neighbor 172.16.0.61 next-hop-self
 neighbor 172.16.0.61 route-reflector-client
 neighbor 172.16.0.61 send-community both
 neighbor 172.16.0.61 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.61 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.62 remote-as 4220000007
 neighbor 172.16.0.62 update-source Loopback0
 neighbor 172.16.0.62 next-hop-self
 neighbor 172.16.0.62 route-reflector-client
 neighbor 172.16.0.62 send-community both
 neighbor 172.16.0.62 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.62 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.251 remote-as 4230000000
 neighbor 198.18.3.251 send-community both
 neighbor 198.18.3.251 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.251 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.253 remote-as 4230000000
 neighbor 198.18.3.253 send-community both
 neighbor 198.18.3.253 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.253 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
