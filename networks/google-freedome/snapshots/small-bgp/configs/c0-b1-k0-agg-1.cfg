version 15.2
hostname c0-b1-k0-agg-1
ip routing
!
interface Loopback0
 ip address 172.16.0.112 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b1-k0-tor-0
 no switchport
 ip address 198.18.3.3 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b1-k0-tor-1
 no switchport
 ip address 198.18.3.7 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c0-b1-k0-tor-2
 no switchport
 ip address 198.18.3.11 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c0-b1-k0-tor-3
 no switchport
 ip address 198.18.3.15 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description cluster-internal to c0-b1-k0-spine-0
 no switchport
 ip address 198.18.3.20 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description cluster-internal to c0-b1-k0-spine-1
 no switchport
 ip address 198.18.3.22 255.255.255.254
 no shutdown
!
router bgp 4240000111
 bgp router-id 172.16.0.112
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.3.21 remote-as 4240000112
 neighbor 198.18.3.21 send-community both
 neighbor 198.18.3.21 route-map FABRIC_ROUTES in
 neighbor 198.18.3.21 route-map FABRIC_ROUTES out
 neighbor 198.18.3.23 remote-as 4240000113
 neighbor 198.18.3.23 send-community both
 neighbor 198.18.3.23 route-map FABRIC_ROUTES in
 neighbor 198.18.3.23 route-map FABRIC_ROUTES out
 neighbor 198.18.3.2 remote-as 4240000106
 neighbor 198.18.3.2 send-community both
 neighbor 198.18.3.2 route-map FABRIC_ROUTES in
 neighbor 198.18.3.2 route-map FABRIC_ROUTES out
 neighbor 198.18.3.6 remote-as 4240000107
 neighbor 198.18.3.6 send-community both
 neighbor 198.18.3.6 route-map FABRIC_ROUTES in
 neighbor 198.18.3.6 route-map FABRIC_ROUTES out
 neighbor 198.18.3.10 remote-as 4240000108
 neighbor 198.18.3.10 send-community both
 neighbor 198.18.3.10 route-map FABRIC_ROUTES in
 neighbor 198.18.3.10 route-map FABRIC_ROUTES out
 neighbor 198.18.3.14 remote-as 4240000109
 neighbor 198.18.3.14 send-community both
 neighbor 198.18.3.14 route-map FABRIC_ROUTES in
 neighbor 198.18.3.14 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.1.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
