version 15.2
hostname c1-b1-k0-spine-1
ip routing
!
interface Loopback0
 ip address 172.16.0.134 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c1-b1-k0-agg-0
 no switchport
 ip address 198.18.3.147 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c1-b1-k0-agg-1
 no switchport
 ip address 198.18.3.151 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c1-b1-k0-cbr-0
 no switchport
 ip address 198.18.3.156 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c1-b1-k0-cbr-1
 no switchport
 ip address 198.18.3.158 255.255.255.254
 no shutdown
!
router bgp 4240000133
 bgp router-id 172.16.0.134
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.3.146 remote-as 4240000130
 neighbor 198.18.3.146 send-community both
 neighbor 198.18.3.146 route-map FABRIC_ROUTES in
 neighbor 198.18.3.146 route-map FABRIC_ROUTES out
 neighbor 198.18.3.150 remote-as 4240000131
 neighbor 198.18.3.150 send-community both
 neighbor 198.18.3.150 route-map FABRIC_ROUTES in
 neighbor 198.18.3.150 route-map FABRIC_ROUTES out
 neighbor 198.18.3.157 remote-as 4240000134
 neighbor 198.18.3.157 send-community both
 neighbor 198.18.3.157 route-map FABRIC_ROUTES in
 neighbor 198.18.3.157 route-map FABRIC_ROUTES out
 neighbor 198.18.3.159 remote-as 4240000135
 neighbor 198.18.3.159 send-community both
 neighbor 198.18.3.159 route-map FABRIC_ROUTES in
 neighbor 198.18.3.159 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.3.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
