version 15.2
hostname c1-b0-k0-agg-0
ip routing
!
interface Loopback0
 ip address 172.16.0.121 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c1-b0-k0-tor-0
 no switchport
 ip address 198.18.3.65 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c1-b0-k0-tor-1
 no switchport
 ip address 198.18.3.69 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c1-b0-k0-tor-2
 no switchport
 ip address 198.18.3.73 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c1-b0-k0-tor-3
 no switchport
 ip address 198.18.3.77 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description cluster-internal to c1-b0-k0-spine-0
 no switchport
 ip address 198.18.3.80 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description cluster-internal to c1-b0-k0-spine-1
 no switchport
 ip address 198.18.3.82 255.255.255.254
 no shutdown
!
router bgp 4240000120
 bgp router-id 172.16.0.121
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.3.81 remote-as 4240000122
 neighbor 198.18.3.81 send-community both
 neighbor 198.18.3.81 route-map FABRIC_ROUTES in
 neighbor 198.18.3.81 route-map FABRIC_ROUTES out
 neighbor 198.18.3.83 remote-as 4240000123
 neighbor 198.18.3.83 send-community both
 neighbor 198.18.3.83 route-map FABRIC_ROUTES in
 neighbor 198.18.3.83 route-map FABRIC_ROUTES out
 neighbor 198.18.3.64 remote-as 4240000116
 neighbor 198.18.3.64 send-community both
 neighbor 198.18.3.64 route-map FABRIC_ROUTES in
 neighbor 198.18.3.64 route-map FABRIC_ROUTES out
 neighbor 198.18.3.68 remote-as 4240000117
 neighbor 198.18.3.68 send-community both
 neighbor 198.18.3.68 route-map FABRIC_ROUTES in
 neighbor 198.18.3.68 route-map FABRIC_ROUTES out
 neighbor 198.18.3.72 remote-as 4240000118
 neighbor 198.18.3.72 send-community both
 neighbor 198.18.3.72 route-map FABRIC_ROUTES in
 neighbor 198.18.3.72 route-map FABRIC_ROUTES out
 neighbor 198.18.3.76 remote-as 4240000119
 neighbor 198.18.3.76 send-community both
 neighbor 198.18.3.76 route-map FABRIC_ROUTES in
 neighbor 198.18.3.76 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.2.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
