version 15.2
hostname c1-b1-k0-spine-0
ip routing
!
interface Loopback0
 ip address 172.16.0.133 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c1-b1-k0-agg-0
 no switchport
 ip address 198.18.3.145 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c1-b1-k0-agg-1
 no switchport
 ip address 198.18.3.149 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c1-b1-k0-cbr-0
 no switchport
 ip address 198.18.3.152 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c1-b1-k0-cbr-1
 no switchport
 ip address 198.18.3.154 255.255.255.254
 no shutdown
!
router bgp 4240000132
 bgp router-id 172.16.0.133
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.3.144 remote-as 4240000130
 neighbor 198.18.3.144 send-community both
 neighbor 198.18.3.144 route-map FABRIC_ROUTES in
 neighbor 198.18.3.144 route-map FABRIC_ROUTES out
 neighbor 198.18.3.148 remote-as 4240000131
 neighbor 198.18.3.148 send-community both
 neighbor 198.18.3.148 route-map FABRIC_ROUTES in
 neighbor 198.18.3.148 route-map FABRIC_ROUTES out
 neighbor 198.18.3.153 remote-as 4240000134
 neighbor 198.18.3.153 send-community both
 neighbor 198.18.3.153 route-map FABRIC_ROUTES in
 neighbor 198.18.3.153 route-map FABRIC_ROUTES out
 neighbor 198.18.3.155 remote-as 4240000135
 neighbor 198.18.3.155 send-community both
 neighbor 198.18.3.155 route-map FABRIC_ROUTES in
 neighbor 198.18.3.155 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.3.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
