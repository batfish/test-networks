version 15.2
hostname c0-campus-f2-border-0
ip routing
!
interface Loopback0
 ip address 172.16.0.11 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c0-campus-f2-edge-0
 no switchport
 ip address 198.18.0.17 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c0-campus-f2-edge-1
 no switchport
 ip address 198.18.0.21 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description wan-uplink to wan-0
 no switchport
 ip address 198.18.3.210 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description wan-uplink to wan-1
 no switchport
 ip address 198.18.3.212 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.11
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4220000002
 bgp router-id 172.16.0.11
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.12 remote-as 4220000002
 neighbor 172.16.0.12 update-source Loopback0
 neighbor 172.16.0.12 next-hop-self
 neighbor 172.16.0.12 send-community both
 neighbor 172.16.0.12 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.12 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.9 remote-as 4220000002
 neighbor 172.16.0.9 update-source Loopback0
 neighbor 172.16.0.9 next-hop-self
 neighbor 172.16.0.9 route-reflector-client
 neighbor 172.16.0.9 send-community both
 neighbor 172.16.0.9 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.9 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.10 remote-as 4220000002
 neighbor 172.16.0.10 update-source Loopback0
 neighbor 172.16.0.10 next-hop-self
 neighbor 172.16.0.10 route-reflector-client
 neighbor 172.16.0.10 send-community both
 neighbor 172.16.0.10 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.10 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.211 remote-as 4230000000
 neighbor 198.18.3.211 send-community both
 neighbor 198.18.3.211 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.211 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.213 remote-as 4230000000
 neighbor 198.18.3.213 send-community both
 neighbor 198.18.3.213 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.213 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
