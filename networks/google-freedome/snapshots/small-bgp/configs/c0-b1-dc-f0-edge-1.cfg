version 15.2
hostname c0-b1-dc-f0-edge-1
ip routing
!
interface Loopback0
 ip address 172.16.0.34 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c0-b1-dc-f0-border-0
 no switchport
 ip address 198.18.0.196 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c0-b1-dc-f0-border-1
 no switchport
 ip address 198.18.0.198 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c0-b1-k0-cbr-0
 no switchport
 ip address 198.18.3.35 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c0-b1-k0-cbr-1
 no switchport
 ip address 198.18.3.51 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.34
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4210000004
 bgp router-id 172.16.0.34
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.35 remote-as 4210000004
 neighbor 172.16.0.35 update-source Loopback0
 neighbor 172.16.0.35 next-hop-self
 neighbor 172.16.0.35 send-community both
 neighbor 172.16.0.35 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.35 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.36 remote-as 4210000004
 neighbor 172.16.0.36 update-source Loopback0
 neighbor 172.16.0.36 next-hop-self
 neighbor 172.16.0.36 send-community both
 neighbor 172.16.0.36 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.36 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.34 remote-as 4240000114
 neighbor 198.18.3.34 send-community both
 neighbor 198.18.3.34 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.34 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.50 remote-as 4240000115
 neighbor 198.18.3.50 send-community both
 neighbor 198.18.3.50 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.50 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
