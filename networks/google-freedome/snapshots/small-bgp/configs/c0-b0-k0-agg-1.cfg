version 15.2
hostname c0-b0-k0-agg-1
ip routing
!
interface Loopback0
 ip address 172.16.0.102 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b0-k0-tor-0
 no switchport
 ip address 198.18.2.195 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b0-k0-tor-1
 no switchport
 ip address 198.18.2.199 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c0-b0-k0-tor-2
 no switchport
 ip address 198.18.2.203 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c0-b0-k0-tor-3
 no switchport
 ip address 198.18.2.207 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description cluster-internal to c0-b0-k0-spine-0
 no switchport
 ip address 198.18.2.212 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description cluster-internal to c0-b0-k0-spine-1
 no switchport
 ip address 198.18.2.214 255.255.255.254
 no shutdown
!
router bgp 4240000101
 bgp router-id 172.16.0.102
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.2.213 remote-as 4240000102
 neighbor 198.18.2.213 send-community both
 neighbor 198.18.2.213 route-map FABRIC_ROUTES in
 neighbor 198.18.2.213 route-map FABRIC_ROUTES out
 neighbor 198.18.2.215 remote-as 4240000103
 neighbor 198.18.2.215 send-community both
 neighbor 198.18.2.215 route-map FABRIC_ROUTES in
 neighbor 198.18.2.215 route-map FABRIC_ROUTES out
 neighbor 198.18.2.194 remote-as 4240000096
 neighbor 198.18.2.194 send-community both
 neighbor 198.18.2.194 route-map FABRIC_ROUTES in
 neighbor 198.18.2.194 route-map FABRIC_ROUTES out
 neighbor 198.18.2.198 remote-as 4240000097
 neighbor 198.18.2.198 send-community both
 neighbor 198.18.2.198 route-map FABRIC_ROUTES in
 neighbor 198.18.2.198 route-map FABRIC_ROUTES out
 neighbor 198.18.2.202 remote-as 4240000098
 neighbor 198.18.2.202 send-community both
 neighbor 198.18.2.202 route-map FABRIC_ROUTES in
 neighbor 198.18.2.202 route-map FABRIC_ROUTES out
 neighbor 198.18.2.206 remote-as 4240000099
 neighbor 198.18.2.206 send-community both
 neighbor 198.18.2.206 route-map FABRIC_ROUTES in
 neighbor 198.18.2.206 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.0.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
