version 15.2
hostname c0-b0-k0-agg-0
ip routing
!
interface Loopback0
 ip address 172.16.0.101 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b0-k0-tor-0
 no switchport
 ip address 198.18.2.193 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b0-k0-tor-1
 no switchport
 ip address 198.18.2.197 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c0-b0-k0-tor-2
 no switchport
 ip address 198.18.2.201 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c0-b0-k0-tor-3
 no switchport
 ip address 198.18.2.205 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description cluster-internal to c0-b0-k0-spine-0
 no switchport
 ip address 198.18.2.208 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description cluster-internal to c0-b0-k0-spine-1
 no switchport
 ip address 198.18.2.210 255.255.255.254
 no shutdown
!
router bgp 4240000100
 bgp router-id 172.16.0.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.2.209 remote-as 4240000102
 neighbor 198.18.2.209 send-community both
 neighbor 198.18.2.209 route-map FABRIC_ROUTES in
 neighbor 198.18.2.209 route-map FABRIC_ROUTES out
 neighbor 198.18.2.211 remote-as 4240000103
 neighbor 198.18.2.211 send-community both
 neighbor 198.18.2.211 route-map FABRIC_ROUTES in
 neighbor 198.18.2.211 route-map FABRIC_ROUTES out
 neighbor 198.18.2.192 remote-as 4240000096
 neighbor 198.18.2.192 send-community both
 neighbor 198.18.2.192 route-map FABRIC_ROUTES in
 neighbor 198.18.2.192 route-map FABRIC_ROUTES out
 neighbor 198.18.2.196 remote-as 4240000097
 neighbor 198.18.2.196 send-community both
 neighbor 198.18.2.196 route-map FABRIC_ROUTES in
 neighbor 198.18.2.196 route-map FABRIC_ROUTES out
 neighbor 198.18.2.200 remote-as 4240000098
 neighbor 198.18.2.200 send-community both
 neighbor 198.18.2.200 route-map FABRIC_ROUTES in
 neighbor 198.18.2.200 route-map FABRIC_ROUTES out
 neighbor 198.18.2.204 remote-as 4240000099
 neighbor 198.18.2.204 send-community both
 neighbor 198.18.2.204 route-map FABRIC_ROUTES in
 neighbor 198.18.2.204 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.0.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
