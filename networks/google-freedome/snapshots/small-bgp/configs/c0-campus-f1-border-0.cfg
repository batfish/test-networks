version 15.2
hostname c0-campus-f1-border-0
ip routing
!
interface Loopback0
 ip address 172.16.0.7 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c0-campus-f1-edge-0
 no switchport
 ip address 198.18.0.9 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c0-campus-f1-edge-1
 no switchport
 ip address 198.18.0.13 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description wan-uplink to wan-0
 no switchport
 ip address 198.18.3.202 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description wan-uplink to wan-1
 no switchport
 ip address 198.18.3.204 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.7
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4220000001
 bgp router-id 172.16.0.7
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.8 remote-as 4220000001
 neighbor 172.16.0.8 update-source Loopback0
 neighbor 172.16.0.8 next-hop-self
 neighbor 172.16.0.8 send-community both
 neighbor 172.16.0.8 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.8 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.5 remote-as 4220000001
 neighbor 172.16.0.5 update-source Loopback0
 neighbor 172.16.0.5 next-hop-self
 neighbor 172.16.0.5 route-reflector-client
 neighbor 172.16.0.5 send-community both
 neighbor 172.16.0.5 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.5 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.6 remote-as 4220000001
 neighbor 172.16.0.6 update-source Loopback0
 neighbor 172.16.0.6 next-hop-self
 neighbor 172.16.0.6 route-reflector-client
 neighbor 172.16.0.6 send-community both
 neighbor 172.16.0.6 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.6 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.203 remote-as 4230000000
 neighbor 198.18.3.203 send-community both
 neighbor 198.18.3.203 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.203 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.205 remote-as 4230000000
 neighbor 198.18.3.205 send-community both
 neighbor 198.18.3.205 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.205 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
