version 15.2
hostname c1-b1-k0-agg-0
ip routing
!
interface Loopback0
 ip address 172.16.0.131 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c1-b1-k0-tor-0
 no switchport
 ip address 198.18.3.129 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c1-b1-k0-tor-1
 no switchport
 ip address 198.18.3.133 255.255.255.254
