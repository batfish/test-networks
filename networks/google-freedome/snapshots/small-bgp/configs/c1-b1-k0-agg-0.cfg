 neighbor 198.18.3.145 remote-as 4240000132
 neighbor 198.18.3.145 send-community both
 neighbor 198.18.3.145 route-map FABRIC_ROUTES in
 neighbor 198.18.3.145 route-map FABRIC_ROUTES out
