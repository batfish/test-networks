 neighbor 198.18.3.128 route-map FABRIC_ROUTES out
 neighbor 198.18.3.132 remote-as 4240000127
 neighbor 198.18.3.132 send-community both
 neighbor 198.18.3.132 route-map FABRIC_ROUTES in
 neighbor 198.18.3.132 route-map FABRIC_ROUTES out
 neighbor 198.18.3.136 remote-as 4240000128
