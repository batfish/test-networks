version 15.2
hostname c1-b0-k0-agg-1
ip routing
!
interface Loopback0
 ip address 172.16.0.122 255.255.255.255
!
interface GigabitEthernet0/0
 description cluster-internal to c1-b0-k0-tor-0
 no switchport
 ip address 198.18.3.67 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c1-b0-k0-tor-1
 no switchport
 ip address 198.18.3.71 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-internal to c1-b0-k0-tor-2
 no switchport
 ip address 198.18.3.75 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-internal to c1-b0-k0-tor-3
 no switchport
