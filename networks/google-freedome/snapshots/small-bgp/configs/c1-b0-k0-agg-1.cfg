 no shutdown
!
interface GigabitEthernet0/4
 description cluster-internal to c1-b0-k0-spine-0
 no switchport
 ip address 198.18.3.84 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description cluster-internal to c1-b0-k0-spine-1
 no switchport
 ip address 198.18.3.86 255.255.255.254
 no shutdown
!
router bgp 4240000121
 bgp router-id 172.16.0.122
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 198.18.3.85 remote-as 4240000122
 neighbor 198.18.3.85 send-community both
 neighbor 198.18.3.85 route-map FABRIC_ROUTES in
 neighbor 198.18.3.85 route-map FABRIC_ROUTES out
 neighbor 198.18.3.87 remote-as 4240000123
 neighbor 198.18.3.87 send-community both
 neighbor 198.18.3.87 route-map FABRIC_ROUTES in
 neighbor 198.18.3.87 route-map FABRIC_ROUTES out
 neighbor 198.18.3.66 remote-as 4240000116
 neighbor 198.18.3.66 send-community both
 neighbor 198.18.3.66 route-map FABRIC_ROUTES in
 neighbor 198.18.3.66 route-map FABRIC_ROUTES out
 neighbor 198.18.3.70 remote-as 4240000117
 neighbor 198.18.3.70 send-community both
 neighbor 198.18.3.70 route-map FABRIC_ROUTES in
 neighbor 198.18.3.70 route-map FABRIC_ROUTES out
 neighbor 198.18.3.74 remote-as 4240000118
 neighbor 198.18.3.74 send-community both
 neighbor 198.18.3.74 route-map FABRIC_ROUTES in
 neighbor 198.18.3.74 route-map FABRIC_ROUTES out
 neighbor 198.18.3.78 remote-as 4240000119
 neighbor 198.18.3.78 send-community both
 neighbor 198.18.3.78 route-map FABRIC_ROUTES in
 neighbor 198.18.3.78 route-map FABRIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list LOCAL_RACKS seq 10 permit 10.2.0.0/16 ge 24 le 24
route-map FABRIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
route-map FABRIC_ROUTES permit 20
 match ip address prefix-list LOCAL_RACKS
!
end
