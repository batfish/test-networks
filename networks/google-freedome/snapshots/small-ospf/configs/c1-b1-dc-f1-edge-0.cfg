version 15.2
hostname c1-b1-dc-f1-edge-0
ip routing
!
interface Loopback0
 ip address 172.16.0.85 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c1-b1-dc-f1-border-0
 no switchport
 ip address 198.18.2.40 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c1-b1-dc-f1-border-1
 no switchport
 ip address 198.18.2.42 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c1-b1-k0-cbr-0
 no switchport
 ip address 198.18.3.165 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c1-b1-k0-cbr-1
 no switchport
 ip address 198.18.3.181 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.85
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4210000013
 bgp router-id 172.16.0.85
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.87 remote-as 4210000013
 neighbor 172.16.0.87 update-source Loopback0
 neighbor 172.16.0.87 next-hop-self
 neighbor 172.16.0.87 send-community both
 neighbor 172.16.0.87 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.87 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.88 remote-as 4210000013
 neighbor 172.16.0.88 update-source Loopback0
 neighbor 172.16.0.88 next-hop-self
 neighbor 172.16.0.88 send-community both
 neighbor 172.16.0.88 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.88 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.164 remote-as 4200000003
 neighbor 198.18.3.164 send-community both
 neighbor 198.18.3.164 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.164 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.180 remote-as 4200000003
 neighbor 198.18.3.180 send-community both
 neighbor 198.18.3.180 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.180 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
