 no shutdown
!
interface GigabitEthernet0/2
 description campus-uplink to c0-campus-f0-edge-0
 no switchport
 ip address 198.18.0.64 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description campus-uplink to c0-campus-f0-edge-1
 no switchport
