version 15.2
hostname c0-b0-dc-f0-border-0
ip routing
!
interface Loopback0
 ip address 172.16.0.19 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c0-b0-dc-f0-edge-0
 no switchport
 ip address 198.18.0.33 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c0-b0-dc-f0-edge-1
 no switchport
