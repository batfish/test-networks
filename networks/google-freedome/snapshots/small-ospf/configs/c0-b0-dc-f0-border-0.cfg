 neighbor 172.16.0.20 remote-as 4210000000
 neighbor 172.16.0.20 update-source Loopback0
 neighbor 172.16.0.20 next-hop-self
 neighbor 172.16.0.20 send-community both
 neighbor 172.16.0.20 route-map PUBLIC_ROUTES in
