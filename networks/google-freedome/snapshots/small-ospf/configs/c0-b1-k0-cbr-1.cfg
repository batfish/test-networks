version 15.2
hostname c0-b1-k0-cbr-1
ip routing
!
interface Loopback0
 ip address 172.16.0.116 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b1-k0-spine-0
 no switchport
 ip address 198.18.3.27 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b1-k0-spine-1
 no switchport
 ip address 198.18.3.31 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c0-b1-dc-f0-edge-0
 no switchport
 ip address 198.18.3.48 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c0-b1-dc-f0-edge-1
 no switchport
 ip address 198.18.3.50 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description cluster-egress to c0-b1-dc-f1-edge-0
 no switchport
 ip address 198.18.3.52 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description cluster-egress to c0-b1-dc-f1-edge-1
 no switchport
 ip address 198.18.3.54 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/6
 description cluster-egress to c0-b1-dc-f2-edge-0
 no switchport
 ip address 198.18.3.56 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/7
 description cluster-egress to c0-b1-dc-f2-edge-1
 no switchport
 ip address 198.18.3.58 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/8
 description cluster-egress to c0-b1-dc-f3-edge-0
 no switchport
 ip address 198.18.3.60 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/9
 description cluster-egress to c0-b1-dc-f3-edge-1
 no switchport
 ip address 198.18.3.62 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.116
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 distribute-list prefix OSPF_IMPORT in
 default-information originate metric 10 metric-type 1 route-map HAS_EXTERNAL
!
router bgp 4200000001
 bgp router-id 172.16.0.116
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 redistribute ospf 1 route-map RACK_ONLY
 aggregate-address 10.1.0.0 255.255.0.0 summary-only
 neighbor 198.18.3.49 remote-as 4210000004
 neighbor 198.18.3.49 send-community both
 neighbor 198.18.3.49 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.49 route-map CLUSTER_ONLY out
 neighbor 198.18.3.51 remote-as 4210000004
 neighbor 198.18.3.51 send-community both
 neighbor 198.18.3.51 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.51 route-map CLUSTER_ONLY out
 neighbor 198.18.3.53 remote-as 4210000005
 neighbor 198.18.3.53 send-community both
 neighbor 198.18.3.53 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.53 route-map CLUSTER_ONLY out
 neighbor 198.18.3.55 remote-as 4210000005
 neighbor 198.18.3.55 send-community both
 neighbor 198.18.3.55 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.55 route-map CLUSTER_ONLY out
 neighbor 198.18.3.57 remote-as 4210000006
 neighbor 198.18.3.57 send-community both
 neighbor 198.18.3.57 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.57 route-map CLUSTER_ONLY out
 neighbor 198.18.3.59 remote-as 4210000006
 neighbor 198.18.3.59 send-community both
 neighbor 198.18.3.59 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.59 route-map CLUSTER_ONLY out
 neighbor 198.18.3.61 remote-as 4210000007
 neighbor 198.18.3.61 send-community both
 neighbor 198.18.3.61 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.61 route-map CLUSTER_ONLY out
 neighbor 198.18.3.63 remote-as 4210000007
 neighbor 198.18.3.63 send-community both
 neighbor 198.18.3.63 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.63 route-map CLUSTER_ONLY out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list CLUSTER seq 10 permit 10.1.0.0/16
ip prefix-list RACKS seq 10 permit 10.1.0.0/16 ge 24 le 32
ip prefix-list DEFAULT_ONLY seq 10 permit 0.0.0.0/0
ip prefix-list OTHER_CLUSTERS seq 10 deny 10.1.0.0/16
ip prefix-list OTHER_CLUSTERS seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list OSPF_IMPORT seq 10 deny 0.0.0.0/0
ip prefix-list OSPF_IMPORT seq 20 permit 0.0.0.0/0 le 32
route-map CLUSTER_ONLY permit 10
 match ip address prefix-list CLUSTER
!
route-map RACK_ONLY permit 10
 match ip address prefix-list RACKS
!
route-map HAS_EXTERNAL permit 10
 match ip address prefix-list DEFAULT_ONLY
route-map HAS_EXTERNAL permit 20
 match ip address prefix-list OTHER_CLUSTERS
!
end
