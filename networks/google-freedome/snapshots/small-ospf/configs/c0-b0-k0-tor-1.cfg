version 15.2
hostname c0-b0-k0-tor-1
ip routing
!
interface Loopback0
 ip address 172.16.0.98 255.255.255.255
 ip ospf 1 area 0
!
interface Loopback100
 ip address 10.0.1.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b0-k0-agg-0
 no switchport
 ip address 198.18.2.196 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b0-k0-agg-1
 no switchport
 ip address 198.18.2.198 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
router ospf 1
 router-id 172.16.0.98
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
end
