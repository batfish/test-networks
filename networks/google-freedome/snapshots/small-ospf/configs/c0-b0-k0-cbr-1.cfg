version 15.2
hostname c0-b0-k0-cbr-1
ip routing
!
interface Loopback0
 ip address 172.16.0.106 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description cluster-internal to c0-b0-k0-spine-0
 no switchport
 ip address 198.18.2.219 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description cluster-internal to c0-b0-k0-spine-1
 no switchport
 ip address 198.18.2.223 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c0-b0-dc-f0-edge-0
 no switchport
 ip address 198.18.2.240 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c0-b0-dc-f0-edge-1
 no switchport
 ip address 198.18.2.242 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/4
 description cluster-egress to c0-b0-dc-f1-edge-0
 no switchport
 ip address 198.18.2.244 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/5
 description cluster-egress to c0-b0-dc-f1-edge-1
 no switchport
 ip address 198.18.2.246 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/6
 description cluster-egress to c0-b0-dc-f2-edge-0
 no switchport
 ip address 198.18.2.248 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/7
 description cluster-egress to c0-b0-dc-f2-edge-1
 no switchport
 ip address 198.18.2.250 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/8
 description cluster-egress to c0-b0-dc-f3-edge-0
 no switchport
 ip address 198.18.2.252 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/9
 description cluster-egress to c0-b0-dc-f3-edge-1
 no switchport
 ip address 198.18.2.254 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.106
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 distribute-list prefix OSPF_IMPORT in
 default-information originate metric 10 metric-type 1 route-map HAS_EXTERNAL
!
router bgp 4200000000
 bgp router-id 172.16.0.106
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 redistribute ospf 1 route-map RACK_ONLY
 aggregate-address 10.0.0.0 255.255.0.0 summary-only
 neighbor 198.18.2.241 remote-as 4210000000
 neighbor 198.18.2.241 send-community both
 neighbor 198.18.2.241 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.241 route-map CLUSTER_ONLY out
 neighbor 198.18.2.243 remote-as 4210000000
 neighbor 198.18.2.243 send-community both
 neighbor 198.18.2.243 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.243 route-map CLUSTER_ONLY out
 neighbor 198.18.2.245 remote-as 4210000001
 neighbor 198.18.2.245 send-community both
 neighbor 198.18.2.245 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.245 route-map CLUSTER_ONLY out
 neighbor 198.18.2.247 remote-as 4210000001
 neighbor 198.18.2.247 send-community both
 neighbor 198.18.2.247 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.247 route-map CLUSTER_ONLY out
 neighbor 198.18.2.249 remote-as 4210000002
 neighbor 198.18.2.249 send-community both
 neighbor 198.18.2.249 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.249 route-map CLUSTER_ONLY out
 neighbor 198.18.2.251 remote-as 4210000002
 neighbor 198.18.2.251 send-community both
 neighbor 198.18.2.251 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.251 route-map CLUSTER_ONLY out
 neighbor 198.18.2.253 remote-as 4210000003
 neighbor 198.18.2.253 send-community both
 neighbor 198.18.2.253 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.253 route-map CLUSTER_ONLY out
 neighbor 198.18.2.255 remote-as 4210000003
 neighbor 198.18.2.255 send-community both
 neighbor 198.18.2.255 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.255 route-map CLUSTER_ONLY out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
ip prefix-list CLUSTER seq 10 permit 10.0.0.0/16
ip prefix-list RACKS seq 10 permit 10.0.0.0/16 ge 24 le 32
ip prefix-list DEFAULT_ONLY seq 10 permit 0.0.0.0/0
ip prefix-list OTHER_CLUSTERS seq 10 deny 10.0.0.0/16
ip prefix-list OTHER_CLUSTERS seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list OSPF_IMPORT seq 10 deny 0.0.0.0/0
ip prefix-list OSPF_IMPORT seq 20 permit 0.0.0.0/0 le 32
route-map CLUSTER_ONLY permit 10
 match ip address prefix-list CLUSTER
!
route-map RACK_ONLY permit 10
 match ip address prefix-list RACKS
!
route-map HAS_EXTERNAL permit 10
 match ip address prefix-list DEFAULT_ONLY
route-map HAS_EXTERNAL permit 20
 match ip address prefix-list OTHER_CLUSTERS
!
end
