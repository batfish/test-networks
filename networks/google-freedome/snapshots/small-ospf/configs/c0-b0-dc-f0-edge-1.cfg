version 15.2
hostname c0-b0-dc-f0-edge-1
ip routing
!
interface Loopback0
 ip address 172.16.0.18 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c0-b0-dc-f0-border-0
 no switchport
 ip address 198.18.0.36 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c0-b0-dc-f0-border-1
 no switchport
 ip address 198.18.0.38 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c0-b0-k0-cbr-0
 no switchport
 ip address 198.18.2.227 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c0-b0-k0-cbr-1
 no switchport
 ip address 198.18.2.243 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.18
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4210000000
 bgp router-id 172.16.0.18
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.19 remote-as 4210000000
 neighbor 172.16.0.19 update-source Loopback0
 neighbor 172.16.0.19 next-hop-self
 neighbor 172.16.0.19 send-community both
 neighbor 172.16.0.19 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.19 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.20 remote-as 4210000000
 neighbor 172.16.0.20 update-source Loopback0
 neighbor 172.16.0.20 next-hop-self
 neighbor 172.16.0.20 send-community both
 neighbor 172.16.0.20 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.20 route-map PUBLIC_ROUTES out
 neighbor 198.18.2.226 remote-as 4200000000
 neighbor 198.18.2.226 send-community both
 neighbor 198.18.2.226 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.226 route-map PUBLIC_ROUTES out
 neighbor 198.18.2.242 remote-as 4200000000
 neighbor 198.18.2.242 send-community both
 neighbor 198.18.2.242 route-map PUBLIC_ROUTES in
 neighbor 198.18.2.242 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
