version 15.2
hostname c1-b0-dc-f2-edge-0
ip routing
!
interface Loopback0
 ip address 172.16.0.73 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c1-b0-dc-f2-border-0
 no switchport
 ip address 198.18.1.144 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c1-b0-dc-f2-border-1
 no switchport
 ip address 198.18.1.146 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c1-b0-k0-cbr-0
 no switchport
 ip address 198.18.3.105 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c1-b0-k0-cbr-1
 no switchport
 ip address 198.18.3.121 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.73
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4210000010
 bgp router-id 172.16.0.73
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.75 remote-as 4210000010
 neighbor 172.16.0.75 update-source Loopback0
 neighbor 172.16.0.75 next-hop-self
 neighbor 172.16.0.75 send-community both
 neighbor 172.16.0.75 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.75 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.76 remote-as 4210000010
 neighbor 172.16.0.76 update-source Loopback0
 neighbor 172.16.0.76 next-hop-self
 neighbor 172.16.0.76 send-community both
 neighbor 172.16.0.76 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.76 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.104 remote-as 4200000002
 neighbor 198.18.3.104 send-community both
 neighbor 198.18.3.104 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.104 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.120 remote-as 4200000002
 neighbor 198.18.3.120 send-community both
 neighbor 198.18.3.120 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.120 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
