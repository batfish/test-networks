version 15.2
hostname c1-b1-dc-f0-edge-0
ip routing
!
interface Loopback0
 ip address 172.16.0.81 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description block-internal to c1-b1-dc-f0-border-0
 no switchport
 ip address 198.18.2.32 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/1
 description block-internal to c1-b1-dc-f0-border-1
 no switchport
 ip address 198.18.2.34 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
interface GigabitEthernet0/2
 description cluster-egress to c1-b1-k0-cbr-0
 no switchport
 ip address 198.18.3.161 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/3
 description cluster-egress to c1-b1-k0-cbr-1
 no switchport
 ip address 198.18.3.177 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 172.16.0.81
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
!
router bgp 4210000012
 bgp router-id 172.16.0.81
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 maximum-paths 16
 maximum-paths ibgp 16
 neighbor 172.16.0.83 remote-as 4210000012
 neighbor 172.16.0.83 update-source Loopback0
 neighbor 172.16.0.83 next-hop-self
 neighbor 172.16.0.83 send-community both
 neighbor 172.16.0.83 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.83 route-map PUBLIC_ROUTES out
 neighbor 172.16.0.84 remote-as 4210000012
 neighbor 172.16.0.84 update-source Loopback0
 neighbor 172.16.0.84 next-hop-self
 neighbor 172.16.0.84 send-community both
 neighbor 172.16.0.84 route-map PUBLIC_ROUTES in
 neighbor 172.16.0.84 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.160 remote-as 4200000003
 neighbor 198.18.3.160 send-community both
 neighbor 198.18.3.160 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.160 route-map PUBLIC_ROUTES out
 neighbor 198.18.3.176 remote-as 4200000003
 neighbor 198.18.3.176 send-community both
 neighbor 198.18.3.176 route-map PUBLIC_ROUTES in
 neighbor 198.18.3.176 route-map PUBLIC_ROUTES out
!
ip prefix-list PUBLIC seq 10 permit 0.0.0.0/0
ip prefix-list PUBLIC seq 20 permit 10.0.0.0/8 ge 16 le 16
ip prefix-list PUBLIC seq 30 permit 192.0.2.0/24 ge 32 le 32
route-map PUBLIC_ROUTES permit 10
 match ip address prefix-list PUBLIC
!
end
